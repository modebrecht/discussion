name: Apply voting and timer

on:
  push:
    branches: [main]
    paths:
      - '.github/apply_voting_timer.py'
      - '.github/workflows/apply-voting-timer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused patch
        run: python .github/apply_voting_timer.py
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add voting and persistent exam timer [skip ci]"
          git push
