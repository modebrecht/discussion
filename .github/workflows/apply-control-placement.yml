name: Apply control placement

on:
  push:
    paths:
      - .github/workflows/apply-control-placement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply focused control placement patch
        run: python .github/apply_control_placement.py

      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/discussion-main.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/discussion-main.js

      - name: Assert placement UI
        run: |
          grep -q 'id="mainControlsHost"' index.html
          grep -q 'id="settingsControlsHost"' index.html
          grep -q 'id="placementEditor"' index.html
          grep -q 'discussion.controlPlacement.v1' index.html
          grep -q 'Alles Hauptmenü' index.html
          grep -q 'data-placement-control="shape"' index.html
          grep -q 'data-placement-control="margin"' index.html

      - name: Commit result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Let users place board controls in main menu or settings [skip ci]"
          git push origin HEAD:main
