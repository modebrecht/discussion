  <style>

<body>
  <header class="toolbar">
    <div class="toolbar-inner">
      <div style="display:flex; align-items:center; gap:.5rem"><div class="logo-pill" title="Theme accent">D</div><h1 class="title">Discussion Board</h1></div>
      <div class="save-controls"><label for="saveSelect" class="sr-only">Current save</label><select id="saveSelect" class="save-select" title="Current save"></select><button id="newSaveBtn" type="button" class="btn btn-primary" title="Create a new empty save">NEW</button></div>
      <div class="font-controls"><button id="importBtn" type="button" class="btn" title="Import chips from a file">Import</button><button id="exportBtn" type="button" class="btn" title="Download chips as a file">Export</button><button id="decFont" class="btn hint" data-hint="Smaller font (F-)" type="button">F-</button><button id="incFont" class="btn hint" data-hint="Larger font (F+)" type="button">F+</button><span class="font-pct">Font: <strong id="fontPct">100%</strong></span></div>

  </header>
  <main class="container">
    <section class="card"><div class="card-body"><div class="input-row"><label for="topicInput" class="sr-only">Add discussion item</label><input id="topicInput" class="input grow" type="text" autocomplete="off" placeholder="Type an item and press Enter..." /><button id="addBtn" type="button" class="btn btn-primary">Add</button></div><div class="options-row"><div class="control-group" style="flex-wrap:wrap; gap:.75rem"><label class="label" title="Give new chips a random background color"><input id="randColor" type="checkbox" checked> Color</label><label class="label" title="Automatically prepend an emoji based on the text"><input id="autoEmoji" type="checkbox"> Emoji</label><button id="reEmoji" type="button" title="Add or remove emojis on all existing chips" class="btn">Emoji</button><label class="label" style="gap:.35rem" title="Adjust pill base size"><span>Size</span><input id="chipSize" type="range" min="0.6" max="6" step="0.005" value="1" /></label><label class="label" style="gap:.35rem" title="Adjust spacing between pills"><span>Spacing</span><input id="chipMargin" type="range" min="0" max="32" step="1" value="8" /></label><button id="masonryToggle" type="button" class="btn" title="Toggle dense masonry packing for chips">Masonry</button><button id="oneLineToggle" type="button" class="btn" title="Show chips in a single vertical column">OneLine</button><input id="importFile" type="file" accept="application/json" style="display:none"></div></div></div></section>
    <section style="margin-top:1.5rem"><div id="list"></div></section>
  </main>
  <script>

    const reEmojiBtn=document.getElementById('reEmoji');reEmojiBtn?.addEventListener('click',()=>{const bs=Array.from(list.querySelectorAll('.btn-item')),remove=bs.some(b=>startsWithEmoji(b.textContent||''));bs.forEach(b=>{const t=b.textContent||'';if(remove)b.textContent=removeLeadingEmoji(t);else if(!startsWithEmoji(t)){const em=detectEmoji(t);if(em)b.textContent=em+' '+t}});refreshChipMetrics();saveChips()});document.addEventListener('keydown',e=>{if(isTypingContext(e.target))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();if(confirm('Delete all items?'))clearAllChips()}else if(e.key==='Delete'){const b=document.activeElement;if(b?.classList?.contains('btn-item')){e.preventDefault();b.closest('.btn-wrap')?.remove();scheduleLayout();saveChips();input.focus()}}else if(!e.altKey&&!e.ctrlKey&&!e.metaKey){const k=e.key.toLowerCase();if(k==='q'){e.preventDefault();adjustChipScale(-chipScaleStep)}else if(k==='w'){e.preventDefault();adjustChipScale(chipScaleStep)}else if(k==='e'){e.preventDefault();input.focus();input.select?.()}}});window.addEventListener('resize',scheduleLayout);list.addEventListener('dragover',e=>{if(layoutConfig.mode==='stack'&&dragState.wrap){e.preventDefault();if(e.target.closest?.('.btn-item'))return}});list.addEventListener('drop',e=>{if(layoutConfig.mode==='stack'&&dragState.wrap&&!e.target.closest?.('.btn-item')){e.preventDefault();list.appendChild(dragState.wrap);dragState.pendingCommit=true;finalizeDrag()}});
  </script>
