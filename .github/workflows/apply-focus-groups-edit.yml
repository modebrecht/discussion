name: Apply focus groups edit

on:
  push:
    paths:
      - '.github/workflows/apply-focus-groups-edit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused patch
        run: python .github/apply_focus_groups_edit.py
      - name: Commit index update
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add focus groups and chip editing [skip ci]"
          git push
