name: Apply settings icon button

on:
  push:
    paths:
      - .github/workflows/oneoff-settings-icon.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace settings label with icon
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button id="settingsBtn" type="button" class="btn settings-btn" aria-haspopup="true" aria-expanded="false" title="Chip settings">⚙ Einstellungen</button>'
          new = '<button id="settingsBtn" type="button" class="btn settings-btn" aria-haspopup="true" aria-expanded="false" aria-label="Einstellungen" title="Einstellungen">⚙</button>'
          if old not in s:
              raise SystemExit('settings button not found')
          s = s.replace(old, new, 1)
          s = s.replace('.settings-btn{min-height:42px;white-space:nowrap}', '.settings-btn{min-height:42px;width:42px;padding:0;display:grid;place-items:center;white-space:nowrap;font-size:1rem}', 1)
          s = s.replace('.settings-btn{padding-inline:.65rem}', '.settings-btn{width:40px;padding:0}', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git rm .github/workflows/oneoff-settings-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use icon-only settings button [skip ci]"
          git push origin HEAD:main
