name: Apply classroom feature polish

on:
  push:
    paths:
      - .github/workflows/apply-classroom-feature-fixes.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply feature polish
        run: python .github/apply_classroom_feature_fixes.py

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Polish classroom feature controls [skip ci]"
          git push origin HEAD:main
