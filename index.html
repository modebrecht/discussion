<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Classroom Discussion Board</title>
  <style>
    /* ===== Theme tokens (PAP style) ===== */
    :root{
      --bg:#f6f7fb;
      --ink:#1f2937;
      --muted:#6b7280;
      --accent:#16a34a;    /* green */
      --accent-2:#06b6d4;  /* cyan */
      --panel:#46474A;     /* anthracite */
      --panel-ink:#f1f5f9; /* light ink on panel */
      --shadow:0 10px 30px rgba(0,0,0,.08);
      --ring: 0 0 0 3px rgba(6, 182, 212, .35);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --chip-font-scale: 1;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      min-height:100vh; margin:0; background:var(--bg); color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }

    /* Header / toolbar */
    .toolbar{background:#fff; box-shadow:var(--shadow);}
    .toolbar-inner{max-width:80rem; margin:0 auto; padding:.75rem 1rem; display:flex; flex-wrap:nowrap; align-items:center; gap:.65rem}
    .toolbar-inner > div:first-child{flex:0 0 auto}
    .logo-pill{height:24px; width:24px; border-radius:12px; display:grid; place-items:center; font:600 12px/1.1 ui-sans-serif; background:var(--panel); color:var(--panel-ink)}
    .title{font-weight:600; font-size:1.125rem; letter-spacing:.01em; white-space:nowrap}
    .save-controls{margin-inline-start:.45rem; display:flex; align-items:center; gap:.4rem; min-width:0; flex:0 0 auto; order:2}
    .save-select{max-width:160px; min-width:128px; border:1px solid #d1d5db; background:#fff; color:#111827; border-radius:var(--radius); padding:.4rem 1.8rem .4rem .65rem; font-size:.875rem; font-weight:600; line-height:1.1}
    .save-select:focus{outline:none; border-color:#22d3ee; box-shadow:var(--ring)}
    .font-controls{margin-inline-start:auto; display:flex; flex-wrap:nowrap; align-items:center; gap:0; min-width:0; white-space:nowrap; order:1}
    .font-controls #importBtn{border-radius:var(--radius) 0 0 var(--radius)}
    .font-controls #exportBtn{border-radius:0 var(--radius) var(--radius) 0; margin-left:-1px; margin-right:.45rem}
    .font-controls #decFont{border-radius:var(--radius) 0 0 var(--radius)}
    .font-controls #incFont{border-radius:0 var(--radius) var(--radius) 0; margin-left:-1px; margin-right:.45rem}
    .font-pct{opacity:.9; font-size:.75rem; line-height:1; white-space:nowrap}

    @media (max-width: 760px){
      .toolbar-inner{max-width:64rem; flex-wrap:wrap; gap:.5rem}
      .save-controls{margin-inline-start:auto; order:2}
      .font-controls{order:3; flex:1 1 100%; margin-inline-start:0}
    }

    /* Layout */
    .container{max-width:64rem; margin:0 auto; padding:0 1rem 4rem}
    .card{margin-top:2rem; border:1px solid #e5e7eb; background:#fff; border-radius:var(--radius-lg); box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .card-body{padding:1rem}
    .input-row{display:flex; flex-wrap:wrap; align-items:center; gap:.75rem}
    .grow{flex:1 1 280px}
    .options-row{margin-top:.75rem; display:flex; flex-wrap:wrap; align-items:center; gap:1rem}
    .control-group{display:inline-flex; align-items:center; gap:.5rem}
    .spacer{margin-inline-start:auto}

    /* Inputs and buttons */
    .input{width:100%; border:1px solid #d1d5db; border-radius:var(--radius); padding:.75rem 1rem; font-size:1rem; background:#fff; color:var(--ink)}
    .input:focus{outline:none; border-color:#22d3ee; box-shadow:var(--ring)}

    .btn{border:1px solid #e5e7eb; background:#f9fafb; color:#111827; border-radius:var(--radius); padding:.4rem .65rem; font-size:.875rem; font-weight:600; line-height:1.1; cursor:pointer}
    .btn:hover{background:#f3f4f6}
    .btn:focus{outline:none; box-shadow:var(--ring)}
    .btn-primary{border-color:#9ee6f1; background:#e6fafd; color:#036c7d}
    .btn-primary:hover{background:#d8f6fb}

    .label{display:inline-flex; align-items:center; gap:.5rem; font-size:.875rem; user-select:none; color:#374151}

    kbd{border:1px solid #d1d5db; border-radius:6px; padding:0 .25rem; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:.85em}

    /* Chip list */
    #list{
      position:relative;
      width:100%;
      min-height:0;
      padding:6px;
    }

    .chip{border:1px solid #e5e7eb; background:#fff; color:#1f2937; border-radius:18px; padding:calc(.5rem * var(--chip-font-scale, 1)) calc(1rem * var(--chip-font-scale, 1)); font-size:calc(.95rem * var(--chip-font-scale, 1)); font-weight:500; box-shadow:0 1px 2px rgba(0,0,0,.05); transition: padding .22s ease, font-size .22s ease, box-shadow .22s ease, background-color .22s ease, border-color .22s ease, transform .12s ease, margin .22s ease; position:relative; overflow:visible; z-index:0; margin:0; --spotlight-border:rgba(6,182,212,.55); --spotlight-shadow-main:rgba(14,165,233,.4); --spotlight-shadow-ring:rgba(6,182,212,.55); --spotlight-shadow-glow:rgba(34,211,238,.6); --spotlight-grad-start:rgba(14,165,233,.16); --spotlight-grad-end:rgba(6,182,212,.08); --spotlight-halo:rgba(34,211,238,.45); --spotlight-pulse-border:rgba(6,182,212,.55)}
    .chip:hover{box-shadow:0 6px 16px rgba(0,0,0,.08); transform:translateY(-1px); border-color:#67e8f9; background:#ecfeff}
    .chip:focus{outline:none; box-shadow:var(--ring)}
    .chip-colored:hover{filter:brightness(1.08)}
    .chip-spotlight{border-color:var(--spotlight-border); box-shadow:0 20px 52px var(--spotlight-shadow-main), 0 0 0 3px var(--spotlight-shadow-ring), 0 0 18px var(--spotlight-shadow-glow); background-image:linear-gradient(135deg, var(--spotlight-grad-start), var(--spotlight-grad-end)); z-index:2}
    .chip-spotlight::before{content:''; position:absolute; inset:-18px; border-radius:inherit; background:radial-gradient(circle, var(--spotlight-halo), transparent 55%); opacity:.9; filter:blur(12px); z-index:-1; pointer-events:none}
    .chip-spotlight::after{content:''; position:absolute; inset:-7px; border-radius:inherit; border:4px solid var(--spotlight-pulse-border); opacity:0; animation:chipSpotlightPulse 1.4s ease-in-out infinite; pointer-events:none; will-change:transform,opacity}
    .chip[draggable="true"]{cursor:grab; touch-action:none}
    .chip[draggable="true"]:active,.chip-dragging{cursor:grabbing}
    .chip-dragging{opacity:.8}
    .btn-wrap.dragging{opacity:.82}
    .btn-wrap.drop-target::before{content:''; position:absolute; inset:-10px; border-radius:28px; border:2px dashed rgba(15,23,42,.22); pointer-events:none; z-index:1}
    @keyframes chipSpotlightPulse{
      0%{opacity:0; transform:scale(.9)}
      45%{opacity:.95; transform:scale(1.02)}
      100%{opacity:0; transform:scale(1.12)}
    }

    /* Grow behavior for spotlight (no overlap) */
    .btn-item{transform-origin:center center}
    .btn-wrap{
      position:absolute;
      display:block;
      margin:0;
      padding:0;
      top:0;
      left:0;
      transform-origin:top left;
      transition:transform .22s ease, padding .22s ease;
      will-change:transform, padding;
    }

    /* Tooltip */
    .hint{position:relative}
    .hint::after{content:attr(data-hint); position:absolute; inset-inline-start:0; inset-block-start:100%; margin-top:.35rem; white-space:nowrap; padding:.25rem .5rem; border-radius:6px; background:rgba(17,24,39,.9); color:#fff; font-size:.75rem; opacity:0; transform:translateY(-2px); pointer-events:none; transition:all .16s ease}
    .hint:hover::after{opacity:1; transform:translateY(0)}

    /* A11y helpers */
    .sr-only{position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0}
  </style>

  <style>

    const raf = (typeof window !== 'undefined' && typeof window.requestAnimationFrame === 'function')

      : (cb) => setTimeout(cb, 16);
    const chipResizeObserver = (typeof ResizeObserver !== 'undefined')
      ? new ResizeObserver(() => scheduleLayout())
      : null;
    let chipSequence = 0;
    let layoutScheduled = false;
    const dragState = { btn: null, wrap: null, pendingCommit: false };
    const storage = (() => {
      try { return typeof localStorage !== 'undefined' ? localStorage : null; }
      catch (_) { return null; }
    })();

    const readStorage = (key) => {
      if (!storage) return null;
      try { return storage.getItem(key); }
      catch (err) { console.warn('Local storage read failed:', err); return null; }
    };

    const writeStorage = (key, value) => {
      if (!storage) return;
      try { storage.setItem(key, value); }
      catch (err) { console.warn('Local storage save failed:', err); }
    };
    const removeStorage = (key) => {
      if (!storage) return;
      try { storage.removeItem(key); }
      catch (err) { console.warn('Local storage remove failed:', err); }
    };

    const HISTORY_LIMIT = 30;
    const undoStack = [];
    const BEAMER_THEME_KEY = 'discussion.beamerTheme.v1';
    const CHIP_FOCUS_CLASS = 'chip-focus';
    const CHIP_GROUPS = new Set(['pro','contra','fragen']);
    const TIMER_STORAGE_KEY = 'discussion.timer.v1';
    const DEFAULT_TIMER_MS = 45 * 60 * 1000;
    const MAX_TIMER_MS = 600 * 60 * 1000;
    let votingMode = false;
    let timerState = null;
    let timerTickHandle = null;
    let lastRandomChip = null;
    let chipMenu = null;
    let chipMenuTarget = null;

    function updateUndoButton(){
      if(undoBtn) undoBtn.disabled = undoStack.length === 0;
    }

    function clearUndoHistory(){
      undoStack.length = 0;
      updateUndoButton();
    }

    function pushUndoSnapshot(){
      if(!list) return;
      const snapshot = {
        chips: getChipData().map(item => ({ ...item })),
        mode: layoutConfig.mode
      };
      const key = JSON.stringify(snapshot);
      const previous = undoStack.length ? undoStack[undoStack.length - 1] : null;
      if(previous && previous.key === key) return;
      undoStack.push({ ...snapshot, key });
      if(undoStack.length > HISTORY_LIMIT) undoStack.shift();
      updateUndoButton();
    }

    function undoLastAction(){
      const snapshot = undoStack.pop();
      if(!snapshot){ updateUndoButton(); return; }
      replaceChips(snapshot.chips, { persist: false, focus: false });
      setLayoutMode(snapshot.mode, { force: true });
      saveChips();
      updateUndoButton();
    }

    function applyBeamerTheme(mode, persist = true){
      const dark = mode === 'dark';
      document.documentElement.dataset.beamerTheme = dark ? 'dark' : 'light';
      if(themeBtn){
        themeBtn.setAttribute('aria-pressed', String(dark));
        themeBtn.textContent = dark ? '☀' : '◐';
        themeBtn.title = dark ? 'Heller Beamer-Modus' : 'Beamer-Dunkelmodus';
      }
      if(persist) writeStorage(BEAMER_THEME_KEY, dark ? 'dark' : 'light');
    }

    function setPresentationMode(active){
      const on = Boolean(active);
      document.documentElement.classList.toggle('presentation-mode', on);
      if(presentBtn) presentBtn.setAttribute('aria-pressed', String(on));
      scheduleLayout();
    }


    function setVotingMode(active){
      votingMode = Boolean(active);
      document.documentElement.classList.toggle('voting-mode', votingMode);
      if(voteBtn){
        voteBtn.classList.toggle('is-active', votingMode);
        voteBtn.setAttribute('aria-pressed', String(votingMode));
      }
    }

    function syncVoteBadge(btn){
      if(!btn) return;
      const wrap = btn.closest('.btn-wrap');
      if(!wrap) return;
      let badge = wrap.querySelector('.vote-badge');
      if(!badge){
        badge = document.createElement('span');
        badge.className = 'vote-badge';
        wrap.appendChild(badge);
      }
      const votes = Math.max(0, Math.round(Number(btn.dataset.votes || '0')) || 0);
      badge.textContent = String(votes);
      badge.hidden = votes <= 0;
      badge.setAttribute('aria-hidden','true');
    }

    function changeChipVotes(btn, delta){
      if(!btn) return;
      const current = Math.max(0, Math.round(Number(btn.dataset.votes || '0')) || 0);
      const next = Math.max(0, current + Math.round(Number(delta) || 0));
      if(next === current) return;
      pushUndoSnapshot();
      btn.dataset.votes = String(next);
      syncVoteBadge(btn);
      saveChips();
    }

    function resetAllVotes(){
      if(!list) return;
      const voted = Array.from(list.querySelectorAll('.btn-item')).filter(btn => Number(btn.dataset.votes || '0') > 0);
      if(!voted.length) return;
      if(!window.confirm('Alle Stimmen auf 0 zurücksetzen?')) return;
      pushUndoSnapshot();
      voted.forEach(btn => {
        btn.dataset.votes = '0';
        syncVoteBadge(btn);
      });
      saveChips();
    }

    function normalizeTimerState(raw){
      const source = raw && typeof raw === 'object' ? raw : {};
      const duration = Math.min(MAX_TIMER_MS, Math.max(60 * 1000, Number(source.durationMs) || DEFAULT_TIMER_MS));
      let running = source.running === true;
      let endAt = Number(source.endAt);
      let remaining = Number(source.remainingMs);
      if(!Number.isFinite(remaining)) remaining = duration;
      remaining = Math.min(MAX_TIMER_MS, Math.max(0, remaining));
      if(running && Number.isFinite(endAt)){
        remaining = Math.max(0, endAt - Date.now());
        if(remaining <= 0){
          running = false;
          endAt = null;
        }
      }else{
        running = false;
        endAt = null;
      }
      return {
        durationMs: duration,
        running,
        endAt: Number.isFinite(endAt) ? endAt : null,
        remainingMs: remaining,
        xl: source.xl === true
      };
    }

    function loadTimerState(){
      const raw = readStorage(TIMER_STORAGE_KEY);
      if(raw){
        try{ return normalizeTimerState(JSON.parse(raw)); }
        catch(err){ console.warn('Timer state parse failed:', err); }
      }
      return normalizeTimerState(null);
    }

    function timerRemaining(now = Date.now()){
      if(!timerState) return DEFAULT_TIMER_MS;
      if(timerState.running && Number.isFinite(timerState.endAt)) return Math.max(0, timerState.endAt - now);
      return Math.max(0, Number(timerState.remainingMs) || 0);
    }

    function persistTimerState(){
      if(!timerState) return;
      const payload = {
        durationMs: timerState.durationMs,
        running: timerState.running,
        endAt: timerState.running ? timerState.endAt : null,
        remainingMs: timerRemaining(),
        xl: timerState.xl
      };
      writeStorage(TIMER_STORAGE_KEY, JSON.stringify(payload));
    }

    function formatTimer(ms){
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
    }

    function timerStatusText(remaining){
      if(remaining <= 0) return 'Zeit abgelaufen';
      if(timerState && timerState.running && Number.isFinite(timerState.endAt)){
        const end = new Date(timerState.endAt);
        return 'Ende ' + end.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      }
      if(timerState && timerState.remainingMs < timerState.durationMs) return 'Pausiert';
      return 'Bereit';
    }

    function syncTimerUI(){
      if(!timerState) return;
      let remaining = timerRemaining();
      if(timerState.running && remaining <= 0){
        timerState.running = false;
        timerState.endAt = null;
        timerState.remainingMs = 0;
        persistTimerState();
        remaining = 0;
      }else if(!timerState.running){
        timerState.remainingMs = remaining;
      }
      const label = formatTimer(remaining);
      const status = timerStatusText(remaining);
      if(timerDisplay) timerDisplay.textContent = label;
      if(timerStateLine) timerStateLine.textContent = status;
      if(timerXLDisplay) timerXLDisplay.textContent = label;
      if(timerXLEnd) timerXLEnd.textContent = status;
      if(timerStartPauseBtn) timerStartPauseBtn.textContent = timerState.running ? 'Pause' : 'Start';
      if(timerXLToggle) timerXLToggle.textContent = timerState.running ? 'Pause' : 'Start';
      if(timerMinutesInput){
        timerMinutesInput.disabled = timerState.running;
        if(document.activeElement !== timerMinutesInput){
          timerMinutesInput.value = String(Math.max(1, Math.round(timerState.durationMs / 60000)));
        }
      }
      document.querySelectorAll('.timer-preset').forEach(btn => { btn.disabled = timerState.running; });
      if(timerBtn){
        timerBtn.classList.toggle('is-active', timerState.running || timerState.xl);
        timerBtn.classList.toggle('timer-finished', remaining <= 0);
      }
      if(timerXL){
        timerXL.hidden = !timerState.xl;
        timerXL.classList.toggle('is-finished', remaining <= 0);
      }
      document.documentElement.classList.toggle('timer-xl-active', timerState.xl);
    }

    function setTimerMinutes(minutes){
      if(!timerState || timerState.running) return;
      const numeric = Number(minutes);
      if(!Number.isFinite(numeric)) return;
      const duration = Math.min(MAX_TIMER_MS, Math.max(60 * 1000, Math.round(numeric * 60000)));
      timerState.durationMs = duration;
      timerState.remainingMs = duration;
      timerState.endAt = null;
      persistTimerState();
      syncTimerUI();
    }

    function toggleTimerRunning(){
      if(!timerState) return;
      if(timerState.running){
        timerState.remainingMs = timerRemaining();
        timerState.running = false;
        timerState.endAt = null;
      }else{
        let remaining = timerRemaining();
        if(remaining <= 0) remaining = timerState.durationMs;
        timerState.remainingMs = remaining;
        timerState.running = true;
        timerState.endAt = Date.now() + remaining;
      }
      persistTimerState();
      syncTimerUI();
    }

    function resetTimer(){
      if(!timerState) return;
      timerState.running = false;
      timerState.endAt = null;
      timerState.remainingMs = timerState.durationMs;
      persistTimerState();
      syncTimerUI();
    }

    function setTimerXL(active){
      if(!timerState) return;
      timerState.xl = Boolean(active);
      persistTimerState();
      syncTimerUI();
    }

    function saveDatePrefix(date = new Date()){
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      return `${day}${month}-${date.getFullYear()}`;
    }

    function nextSaveName(saves, date = new Date()){
      const prefix = saveDatePrefix(date);
      let max = 0;
      (Array.isArray(saves) ? saves : []).forEach(save => {
        if(!save || typeof save.name !== 'string') return;
        const marker = prefix + '#';
        if(!save.name.startsWith(marker)) return;
        const number = Number(save.name.slice(marker.length));
        if(Number.isInteger(number) && number > max) max = number;
      });
      return `${prefix}#${max + 1}`;
    }

    function makeSaveId(){
      return `save-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    }

    function normalizeSaveState(parsed){
      if(!parsed || !Array.isArray(parsed.saves)) return null;
      const saves = parsed.saves
        .filter(save => save && typeof save.id === 'string' && typeof save.name === 'string')
        .map(save => ({
          id: save.id,
          name: save.name,
          chips: Array.isArray(save.chips) ? save.chips : []
        }));
      if(!saves.length) return null;
      const activeId = saves.some(save => save.id === parsed.activeId) ? parsed.activeId : saves[0].id;
      return { activeId, saves };
    }

    function loadSaveState(){
      const raw = readStorage(SAVE_STORAGE_KEY);
      if(raw){
        try{
          const normalized = normalizeSaveState(JSON.parse(raw));
          if(normalized) return normalized;
        }catch(err){
          console.warn('Save collection parse failed:', err);
        }
      }

      let legacyChips = [];
      const legacyRaw = readStorage(LEGACY_STORAGE_KEY);
      if(legacyRaw){
        try{
          const parsedLegacy = JSON.parse(legacyRaw);
          if(Array.isArray(parsedLegacy)) legacyChips = parsedLegacy;
        }catch(err){
          console.warn('Legacy chip storage parse failed:', err);
        }
      }

      const firstSave = {
        id: makeSaveId(),
        name: nextSaveName([]),
        chips: legacyChips
      };
      const state = { activeId: firstSave.id, saves: [firstSave] };
      writeStorage(SAVE_STORAGE_KEY, JSON.stringify(state));
      if(legacyRaw) removeStorage(LEGACY_STORAGE_KEY);
      return state;
    }

    let saveState = loadSaveState();

    function persistSaveState(){
      writeStorage(SAVE_STORAGE_KEY, JSON.stringify(saveState));
    }

    function getActiveSave(){
      return saveState.saves.find(save => save.id === saveState.activeId) || saveState.saves[0] || null;
    }

    function renderSaveSelector(){
      if(!saveSelect) return;
      saveSelect.innerHTML = '';
      saveState.saves.forEach(save => {
        const option = document.createElement('option');
        option.value = save.id;
        option.textContent = save.name;
        option.selected = save.id === saveState.activeId;
        saveSelect.appendChild(option);
      });
    }

    const defaultSettings = { chipScale: 1, gutter: 2, chipPadding: 4 };
    const sliderBounds = {
      size: chipSizeInput ? {
        min: parseFloat(chipSizeInput.min) || defaultSettings.chipScale,
        max: parseFloat(chipSizeInput.max) || defaultSettings.chipScale,
        step: parseFloat(chipSizeInput.step) || 0.005
      } : { min: defaultSettings.chipScale, max: defaultSettings.chipScale, step: 0.005 },
      padding: chipPaddingInput ? {
        min: parseFloat(chipPaddingInput.min) || 1,
        max: parseFloat(chipPaddingInput.max) || 12,
        step: parseFloat(chipPaddingInput.step) || 0.5
      } : { min: 1, max: 12, step: 0.5 },
      margin: chipMarginInput ? {
        min: Number.isFinite(parseFloat(chipMarginInput.min)) ? parseFloat(chipMarginInput.min) : defaultSettings.gutter,
        max: parseFloat(chipMarginInput.max) || defaultSettings.gutter,
        step: parseFloat(chipMarginInput.step) || 1
      } : { min: defaultSettings.gutter, max: defaultSettings.gutter, step: 1 }
    };

    const clampNumber = (value, min, max) => Math.min(max, Math.max(min, value));

    function loadSettings(){
      const raw = readStorage(SETTINGS_KEY);
      if(!raw) return { ...defaultSettings };
      try{
        const parsed = JSON.parse(raw);
        return { ...defaultSettings, ...parsed };
      }catch(err){
        console.warn('Settings parse failed:', err);
        return { ...defaultSettings };
      }
    }

    let settingsReady = false;

    function persistSettings(){
      if(!settingsReady) return;
      const payload = {
        chipScale: Number(chipScale.toFixed(3)),
        gutter: Math.round(layoutConfig.gutter),
        chipPadding: Number(chipPadding.toFixed(1))
      };
      writeStorage(SETTINGS_KEY, JSON.stringify(payload));
    }

    const uiSettings = loadSettings();
    const COMPACT_SPACING_MIGRATION_KEY = 'discussion.compactSpacing.v1';
    if(readStorage(COMPACT_SPACING_MIGRATION_KEY) !== '1'){
      if(Number(uiSettings.gutter) === 8) uiSettings.gutter = 4;
      writeStorage(COMPACT_SPACING_MIGRATION_KEY, '1');
    }
    const DENSE_SPACING_MIGRATION_KEY = 'discussion.compactSpacing.v2';
    if(readStorage(DENSE_SPACING_MIGRATION_KEY) !== '1'){
      if(Number(uiSettings.gutter) === 4) uiSettings.gutter = 2;
      writeStorage(DENSE_SPACING_MIGRATION_KEY, '1');
    }
    const initialChipPadding = Number(uiSettings.chipPadding);
    let chipPadding = Number.isFinite(initialChipPadding)
      ? clampNumber(initialChipPadding, sliderBounds.padding.min, sliderBounds.padding.max)
      : defaultSettings.chipPadding;
    const applyChipPadding = (value, { persist = true } = {}) => {
      const numeric = Number(value);
      if(!Number.isFinite(numeric)) return;
      const step = sliderBounds.padding.step || 0.5;
      const clamped = clampNumber(numeric, sliderBounds.padding.min, sliderBounds.padding.max);
      chipPadding = Math.round(clamped / step) * step;
      const vertical = Number(chipPadding.toFixed(1));
      const horizontal = Number((chipPadding * 2).toFixed(1));
      document.documentElement.style.setProperty('--chip-pad-y', vertical + 'px');
      document.documentElement.style.setProperty('--chip-pad-x', horizontal + 'px');
      if(chipPaddingInput) chipPaddingInput.value = String(vertical);
      if(chipPaddingValue) chipPaddingValue.textContent = vertical + ' / ' + horizontal + ' px';
      refreshChipMetrics();
      if(persist) persistSettings();
    };
    applyChipPadding(chipPadding, { persist: false });
    layoutConfig.gutter = clampNumber(uiSettings.gutter, sliderBounds.margin.min, sliderBounds.margin.max);
    layoutConfig.step = Math.max(2, Math.min(8, Math.round(layoutConfig.gutter / 2))) || layoutConfig.step;
    if(chipMarginInput) chipMarginInput.value = String(Math.round(layoutConfig.gutter));
    if(chipMarginValue) chipMarginValue.textContent = Math.round(layoutConfig.gutter) + ' px';

    function layoutMasonry(wraps, {
      padLeft,
      padTop,
      padBottom,
      availableWidth,
      gutter
    }){
      const unit = Math.max(1, Math.round(layoutConfig.step || 4));
      const columns = Math.max(1, Math.floor((availableWidth + gutter) / unit));
      const columnHeights = new Array(columns).fill(0);
      let maxBottom = 0;

      wraps.forEach(wrap => {
        if(!(wrap instanceof HTMLElement)) return;
        const chip = wrap.firstElementChild instanceof HTMLElement ? wrap.firstElementChild : null;
        const itemWidth = chip ? chip.offsetWidth : wrap.offsetWidth;
        const itemHeight = chip ? chip.offsetHeight : wrap.offsetHeight;
        const padExtra = getSpotlightPad(wrap);
        const widthWithPad = itemWidth + padExtra;
        const heightWithPad = itemHeight + padExtra;
        if(widthWithPad <= 0 || heightWithPad <= 0) return;

        const unitsNeeded = Math.min(columns, Math.max(1, Math.ceil((widthWithPad + gutter) / unit)));
        let bestIndex = 0;
        let bestHeight = Number.POSITIVE_INFINITY;
        const searchLimit = columns - unitsNeeded;

        for(let i = 0; i <= searchLimit; i++){
          let spanHeight = 0;
          for(let j = i; j < i + unitsNeeded; j++){
            spanHeight = Math.max(spanHeight, columnHeights[j]);
            if(spanHeight >= bestHeight) break;
          }
          if(spanHeight < bestHeight){
            bestHeight = spanHeight;
            bestIndex = i;
            if(bestHeight === 0) break;
          }
        }

        const finalLeft = padLeft + bestIndex * unit;
        const finalTop = padTop + bestHeight;
        wrap.style.transform = `translate3d(${finalLeft}px, ${finalTop}px, 0)`;

        const newHeight = bestHeight + heightWithPad + gutter;
        for(let j = bestIndex; j < bestIndex + unitsNeeded; j++){
          columnHeights[j] = newHeight;
        }
        maxBottom = Math.max(maxBottom, bestHeight + heightWithPad);
      });

      const totalHeight = padTop + Math.max(0, maxBottom + padBottom);
      return totalHeight;
    }

    function layoutChipsNow(){
      if(!list) return;
      const wraps = Array.from(list.children).filter(node => node instanceof HTMLElement);
      if(!wraps.length){
        list.style.height = '0px';
        return;
      }
      const { gutter } = layoutConfig;
      const styles = (typeof window !== 'undefined' && window.getComputedStyle)
        ? window.getComputedStyle(list)
        : null;
      const padLeft = styles ? parseFloat(styles.paddingLeft) || 0 : 0;
      const padRight = styles ? parseFloat(styles.paddingRight) || 0 : 0;
      const padTop = styles ? parseFloat(styles.paddingTop) || 0 : 0;
      const padBottom = styles ? parseFloat(styles.paddingBottom) || 0 : 0;
      const rawWidth = list.clientWidth - padLeft - padRight;
      if(rawWidth <= 0){
        list.style.height = '0px';
        return;
      }
      const availableWidth = Math.max(1, rawWidth);

      if(layoutConfig.mode === 'masonry'){
        const totalHeight = layoutMasonry(wraps, {
          padLeft,
          padTop,
          padBottom,
          availableWidth,
          gutter
        });
        list.style.height = totalHeight + 'px';
        return;
      }

      if(layoutConfig.mode === 'stack'){
        let cursorY = 0;
        let maxBottom = 0;
        wraps.forEach(wrap => {
          if(!(wrap instanceof HTMLElement)) return;
          const chip = wrap.firstElementChild instanceof HTMLElement ? wrap.firstElementChild : null;
          const itemHeight = chip ? chip.offsetHeight : wrap.offsetHeight;
          const padExtra = getSpotlightPad(wrap);
          const heightWithPad = itemHeight + padExtra;
          const finalTop = padTop + cursorY;
          wrap.style.transform = `translate3d(${padLeft}px, ${finalTop}px, 0)`;
          cursorY += heightWithPad;
          maxBottom = Math.max(maxBottom, cursorY);
          cursorY += gutter;
        });
        const totalHeight = padTop + Math.max(0, maxBottom + padBottom);
        list.style.height = totalHeight + 'px';
        return;
      }

      let cursorX = 0;
      let cursorY = 0;
      let rowHeight = 0;
      let maxBottom = 0;
      // Lay chips row by row in DOM order so entries stay chronological.
      wraps.forEach(wrap => {
        if(!(wrap instanceof HTMLElement)) return;
        const chip = wrap.firstElementChild instanceof HTMLElement ? wrap.firstElementChild : null;
        // Measure the interactive button itself so spacing stays accurate while wraps animate.
        const itemWidth = chip ? chip.offsetWidth : wrap.offsetWidth;
        const itemHeight = chip ? chip.offsetHeight : wrap.offsetHeight;
        const padExtra = getSpotlightPad(wrap);
        const widthWithPad = itemWidth + padExtra;
        const heightWithPad = itemHeight + padExtra;
        if(cursorX > 0 && cursorX + widthWithPad > availableWidth){
          cursorX = 0;
          cursorY += rowHeight + gutter;
          rowHeight = 0;
        }
        const finalLeft = padLeft + cursorX;
        const finalTop = padTop + cursorY;
        wrap.style.transform = `translate3d(${finalLeft}px, ${finalTop}px, 0)`;
        cursorX += widthWithPad + gutter;
        rowHeight = Math.max(rowHeight, heightWithPad);
        maxBottom = Math.max(maxBottom, cursorY + heightWithPad);
      });
      const totalHeight = padTop + Math.max(0, maxBottom + padBottom);
      list.style.height = totalHeight + 'px';
    }

    function scheduleLayout(){
      if(layoutScheduled) return;
      layoutScheduled = true;
      raf(() => {
        layoutScheduled = false;
        layoutChipsNow();
      });
    }

    if(list){
      window.addEventListener('resize', scheduleLayout);
      list.addEventListener('dragover', handleListDragOver);
      list.addEventListener('drop', handleListDrop);
      list.addEventListener('click', event => {
        if(event.target === list) clearAllHighlights();
      });
    }

    const isTypingContext = (el) => {
      if (!el) return false;
      if (el.isContentEditable) return true;
      const tag = el.tagName;
      return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    };

    function refreshChipMetrics(){
      if (!list) return;
      const buttons = Array.from(list.querySelectorAll('.btn-item'));
      buttons.forEach(btn => {
        const stage = Number(btn.dataset.scaleStage || '0');
        applyStageToChip(btn, stage, { remeasure: true });
        if(chipResizeObserver) chipResizeObserver.observe(btn);
      });
      scheduleLayout();
    }

    // ===== Font toolbar =====
    const fontPct = document.getElementById('fontPct');
    const chipScaleStep = 0.125;
    const chipScaleMin = sliderBounds.size.min;
    const chipScaleMax = 6;
    const sizeStep = sliderBounds.size.step || 0.005;
    let chipScale = clampNumber(uiSettings.chipScale, sliderBounds.size.min, sliderBounds.size.max);
    chipScale = Math.round(chipScale / sizeStep) * sizeStep;
    layoutConfig.chipScale = chipScale;
    if(chipSizeInput) chipSizeInput.value = chipScale.toFixed(3);

    const applyChipScale = () => {
      document.documentElement.style.setProperty('--chip-font-scale', chipScale.toString());
      layoutConfig.chipScale = chipScale;
      if (chipSizeInput && document.activeElement !== chipSizeInput){
        chipSizeInput.value = chipScale.toFixed(3);
      }
      if (fontPct) fontPct.textContent = Math.round(chipScale * 100) + '%';
      refreshChipMetrics();
    };

    const adjustChipScale = (delta) => {
      const nextRaw = Number((chipScale + delta).toFixed(4));
      const next = Math.min(chipScaleMax, Math.max(chipScaleMin, nextRaw));
      if (next === chipScale) return;
      chipScale = next;
      applyChipScale();
      persistSettings();
    };

    const incFontBtn = document.getElementById('incFont');
    const decFontBtn = document.getElementById('decFont');
    const incFont2 = document.getElementById('incFont2');

    function clearChipInlineSizing(btn){
      if(!(btn instanceof HTMLElement)) return;

      style.paddingRight = '';
      style.paddingTop = '';

    function forceChipStyleSync(btn){
      if(!(btn instanceof HTMLElement)) return;

      void btn.offsetWidth;
    }

    function suspendChipTransitions(btn){
      if(!(btn instanceof HTMLElement)) return () => {};

      const prev = style.transition;
      style.transition = 'none';
      // Flush so the no-transition state takes effect immediately.
      void btn.offsetWidth;
      return () => {
        style.transition = prev;
        // Flush again so re-enabled transitions apply to subsequent changes.
        void btn.offsetWidth;
      };
    }

    function updateBaseMetrics(btn){
      const stage = Number(btn.dataset.scaleStage || '0');
      const factor = 1 + (SPOTLIGHT_STEPS[stage] || 0);
      const cs = getComputedStyle(btn);
      const normalize = (value) => {
        const num = parseFloat(value);
        if(!Number.isFinite(num)) return 0;
        return num / (factor || 1);
      };
      btn.dataset.baseFont = String(normalize(cs.fontSize));
      btn.dataset.basePadLeft = String(normalize(cs.paddingLeft));
      btn.dataset.basePadRight = String(normalize(cs.paddingRight));
      btn.dataset.basePadTop = String(normalize(cs.paddingTop));
      btn.dataset.basePadBottom = String(normalize(cs.paddingBottom));
      btn.dataset.metrics='1';
    }

    function applyStageToChip(btn, stage, { remeasure = false } = {}){
      let next = Number(stage);
      if(!Number.isFinite(next) || next < 0 || next >= SPOTLIGHT_STEPS.length) next = 0;
      if(remeasure){
        const restoreTransitions = suspendChipTransitions(btn);
        clearChipInlineSizing(btn);
        forceChipStyleSync(btn);
        btn.dataset.scaleStage = '0';
        btn.dataset.metrics = '0';
      btn.dataset.votes = String(Math.max(0, Math.round(Number(options.votes || 0)) || 0));
        updateBaseMetrics(btn);
        restoreTransitions();
      }else if(btn.dataset.metrics!=='1'){
        updateBaseMetrics(btn);
      }
      btn.dataset.scaleStage = String(next);
      const factor = 1 + SPOTLIGHT_STEPS[next];
      const baseFont = Number(btn.dataset.baseFont);
      const basePadLeft = Number(btn.dataset.basePadLeft);
      const basePadRight = Number(btn.dataset.basePadRight);
      const basePadTop = Number(btn.dataset.basePadTop);
      const basePadBottom = Number(btn.dataset.basePadBottom);
      const style = btn.style;
      if(Math.abs(factor - 1) < 0.0001){
        clearChipInlineSizing(btn);
        return;
      }
      const format = (base) => {
        if(!Number.isFinite(base)) return '';
        const value = base * factor;
        if(Math.abs(value) < 1e-4) return '0px';
        const fixed = value.toFixed(3);
        const trimmed = fixed.replace(/\.?0+$/,'');
        return (trimmed === '' ? '0' : trimmed) + 'px';
      };

      style.paddingLeft = format(basePadLeft);
      style.paddingRight = format(basePadRight);
      style.paddingTop = format(basePadTop);
      style.paddingBottom = format(basePadBottom);
    }

      document.body.appendChild(chipMenu);
      chipMenu.addEventListener('click', event => {
        const button = event.target instanceof Element ? event.target.closest('.chip-menu-btn') : null;
        if(!button || !chipMenuTarget) return;
        event.stopPropagation();
        if(button.dataset.action === 'edit') startChipEdit(chipMenuTarget);
        else if(button.dataset.action === 'pin') toggleChipPinned(chipMenuTarget);
        else if(Object.prototype.hasOwnProperty.call(button.dataset, 'group')) setChipGroup(chipMenuTarget, button.dataset.group || '');
        closeChipMenu();
      });
      chipMenu.addEventListener('contextmenu', event => event.preventDefault());
      document.addEventListener('click', event => {
        if(chipMenu && !chipMenu.hidden && event.target instanceof Node && !chipMenu.contains(event.target)) closeChipMenu();
      });
      document.addEventListener('keydown', event => {
        if(event.key === 'Escape') closeChipMenu();
      });
      window.addEventListener('resize', closeChipMenu);
      return chipMenu;
    }

    function openChipMenu(btn, event){
      if(!btn) return;
      const menu = ensureChipMenu();
      chipMenuTarget = btn;
      const pinButton = menu.querySelector('[data-action="pin"]');
      if(pinButton) pinButton.textContent = btn.dataset.pinned === '1' ? '📌 Pin lösen' : '📌 Anpinnen';
      const group = CHIP_GROUPS.has(btn.dataset.group || '') ? btn.dataset.group : '';
      menu.querySelectorAll('[data-group]').forEach(option => {
        option.classList.toggle('is-active', (option.dataset.group || '') === group);
      });
      menu.hidden = false;
      menu.style.left = '0px';
      menu.style.top = '0px';
      const rect = menu.getBoundingClientRect();
      const x = Math.min(Math.max(6, event.clientX), Math.max(6, window.innerWidth - rect.width - 6));
      const y = Math.min(Math.max(6, event.clientY), Math.max(6, window.innerHeight - rect.height - 6));
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
    }

    function toggleChipPinned(btn){
      if(!btn) return;
      pushUndoSnapshot();
      const pinned = btn.dataset.pinned !== '1';
      if(pinned){
        btn.dataset.pinned = '1';
        btn.classList.add('chip-pinned');
      }else{
        delete btn.dataset.pinned;
        btn.classList.remove('chip-pinned');
      }
      syncChipBadge(btn);
      restoreCreationOrder();
      syncStackDragState();
      scheduleLayout();
      saveChips();
    }

    function registerChipDragHandlers(btn){
      if(!btn || btn.dataset.dragBound === '1') return;
      btn.addEventListener('dragstart', handleChipDragStart);
      btn.addEventListener('dragend', handleChipDragEnd);
      btn.addEventListener('dragenter', handleChipDragEnter);
      btn.addEventListener('dragleave', handleChipDragLeave);
      btn.addEventListener('dragover', handleChipDragOver);
      btn.addEventListener('drop', handleChipDrop);
      btn.dataset.dragBound = '1';
    }

    function syncChipDragCapability(btn){
      if(!btn) return;
      if(layoutConfig.mode === 'stack' && btn.dataset.pinned !== '1'){
        btn.setAttribute('draggable', 'true');
      }else{
        btn.removeAttribute('draggable');
        btn.classList.remove('chip-dragging');
      }
    }

    function syncStackDragState(){
      if(!list) return;
      const enable = layoutConfig.mode === 'stack';
      const wraps = Array.from(list.querySelectorAll('.btn-wrap'));
      wraps.forEach(wrap => {
        if(!(wrap instanceof HTMLElement)) return;
        wrap.classList.remove('dragging', 'drop-target');
        const btn = wrap.firstElementChild instanceof HTMLElement ? wrap.firstElementChild : null;
        if(!btn) return;
        if(enable && btn.dataset.pinned !== '1'){
          btn.setAttribute('draggable', 'true');
        }else{
          btn.removeAttribute('draggable');
          btn.classList.remove('chip-dragging');
        }
      });
    }

    function resequenceWrapOrder(){
      if(!list) return;
      const wraps = Array.from(list.children).filter(node => node instanceof HTMLElement);
      wraps.forEach((wrap, index) => {
        wrap.dataset.createdAt = String(index);
      });
      chipSequence = wraps.length;
    }

    function clearDragHighlights(){
      if(!list) return;
      list.querySelectorAll('.btn-wrap.drop-target').forEach(node => {
        if(node instanceof HTMLElement) node.classList.remove('drop-target');
      });
    }

    function finalizeDrag(){
      if(!list) return;
      if(dragState.wrap instanceof HTMLElement){
        dragState.wrap.classList.remove('dragging');
      }
      if(dragState.btn instanceof HTMLElement){
        dragState.btn.classList.remove('chip-dragging');
      }
      clearDragHighlights();
      if(dragState.pendingCommit){
        resequenceWrapOrder();
        saveChips();
      }
      dragState.btn = null;
      dragState.wrap = null;
      dragState.pendingCommit = false;
      scheduleLayout();
    }

    function handleChipDragStart(event){
      if(layoutConfig.mode !== 'stack'){
        event.preventDefault();
        return;
      }
      const btn = event.currentTarget instanceof HTMLElement ? event.currentTarget : null;
      if(!btn) return;
      const wrap = btn.closest('.btn-wrap');
      if(!(wrap instanceof HTMLElement)){
        event.preventDefault();
        return;
      }
      dragState.btn = btn;
      dragState.wrap = wrap;
      dragState.pendingCommit = false;
      wrap.classList.add('dragging');
      btn.classList.add('chip-dragging');
      if(event.dataTransfer){
        event.dataTransfer.effectAllowed = 'move';
        try{ event.dataTransfer.setData('text/plain', btn.dataset.label || ''); }
        catch(_){}
      }
    }

    function handleChipDragEnd(){
      finalizeDrag();
    }

    function handleChipDragEnter(event){
      if(layoutConfig.mode !== 'stack') return;
      const targetBtn = event.currentTarget instanceof HTMLElement ? event.currentTarget : null;
      if(!targetBtn) return;
      const targetWrap = targetBtn.closest('.btn-wrap');
      if(!(targetWrap instanceof HTMLElement)) return;
      if(dragState.wrap && targetWrap !== dragState.wrap){
        targetWrap.classList.add('drop-target');
      }
    }

    function handleChipDragLeave(event){
      const targetBtn = event.currentTarget instanceof HTMLElement ? event.currentTarget : null;
      if(!targetBtn) return;
      const targetWrap = targetBtn.closest('.btn-wrap');
      if(!(targetWrap instanceof HTMLElement)) return;
      if(targetWrap !== dragState.wrap){
        targetWrap.classList.remove('drop-target');
      }
    }

    function handleChipDragOver(event){
      if(layoutConfig.mode !== 'stack') return;
      if(!dragState.wrap) return;
      event.preventDefault();
      if(event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    }

    function handleChipDrop(event){
      if(layoutConfig.mode !== 'stack') return;
      if(!dragState.wrap) return;
      const sourceWrap = dragState.wrap;
      const targetBtn = event.currentTarget instanceof HTMLElement ? event.currentTarget : null;
      if(!targetBtn) return;
      const targetWrap = targetBtn.closest('.btn-wrap');
      if(!(targetWrap instanceof HTMLElement)) return;
      event.preventDefault();
      event.stopPropagation();
      targetWrap.classList.remove('drop-target');
      if(targetWrap === sourceWrap) return;
      const rect = targetWrap.getBoundingClientRect();
      const shouldInsertAfter = event.clientY > rect.top + rect.height / 2;
      const referenceNode = shouldInsertAfter ? targetWrap.nextSibling : targetWrap;
      if(referenceNode !== sourceWrap){
        list.insertBefore(sourceWrap, referenceNode);
        dragState.pendingCommit = true;
      }
    }

    function handleListDragOver(event){
      if(layoutConfig.mode !== 'stack') return;
      if(!dragState.wrap) return;
      const target = event.target instanceof HTMLElement ? event.target : null;
      if(target && target.closest('.btn-item')) return;
      event.preventDefault();
      if(event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    }

    function handleListDrop(event){
      if(layoutConfig.mode !== 'stack') return;
      if(!dragState.wrap) return;
      event.preventDefault();
      dragState.pendingCommit = true;
      list.appendChild(dragState.wrap);
      finalizeDrag();
    }

    const getSpotlightPad = (wrap) => {
      if(!(wrap instanceof HTMLElement)) return 0;
      const value = Number(wrap.dataset.spotlightPad || '0');
      return Number.isFinite(value) ? Math.max(0, value) : 0;
    };

    function createChip(label, options = {}){
      const wrap=document.createElement('div');
      wrap.className='btn-wrap';
      wrap.style.transform='translate3d(0,0,0)';
      wrap.style.padding='0px';
      const providedOrder = options.createdAt;
      const numericOrder = Number(providedOrder);
      if(Number.isFinite(numericOrder)){
        wrap.dataset.createdAt = String(numericOrder);
        chipSequence = Math.max(chipSequence, numericOrder + 1);
      }else{
        wrap.dataset.createdAt = String(chipSequence++);
      }
      const btn=document.createElement('button'); btn.type='button'; btn.className='btn-item chip';
      btn.dataset.label = label;
      btn.dataset.scaleStage = '0';
      btn.dataset.metrics = '0';
      if(options.pinned){
        btn.dataset.pinned = '1';
        btn.classList.add('chip-pinned');
      }
      if(options.group && CHIP_GROUPS.has(options.group)) btn.dataset.group = options.group;
      btn.textContent = maybeAddEmoji(label);
      if(typeof options.displayText === 'string') btn.textContent = options.displayText;
      registerChipDragHandlers(btn);
      syncChipDragCapability(btn);
      if(chipResizeObserver) chipResizeObserver.observe(btn);
      btn.title='Klick: Grösse · Voting aktiv: +1 Stimme (Shift: -1) · Doppelklick: Bearbeiten · Ctrl/Cmd+Klick/S: Spotlight · Alt+Klick/F: Fokus · Rechtsklick: Menü';
      if(options.color){
        setChipColor(btn, options.color);
      }else if(!options.skipRandom && randToggle && randToggle.checked){
        setChipColor(btn, randomColorHex());
      }else{
        clearChipColor(btn);
      }
      syncChipBadge(btn);
      btn.addEventListener('contextmenu',(event)=>{
        event.preventDefault();
        btn.focus();
        openChipMenu(btn, event);
      });
      let chipClickTimer = null;
      btn.addEventListener('click',(event)=>{
        if(event.ctrlKey || event.metaKey){
          event.preventDefault();
          if(chipClickTimer){ clearTimeout(chipClickTimer); chipClickTimer = null; }
          toggleChipSpotlight(btn);
          btn.focus();
          return;
        }
        if(event.altKey){
          event.preventDefault();
          if(chipClickTimer){ clearTimeout(chipClickTimer); chipClickTimer = null; }
          toggleChipFocus(btn);
          btn.focus();
          return;
        }
        if(votingMode){
          event.preventDefault();
          if(chipClickTimer){ clearTimeout(chipClickTimer); chipClickTimer = null; }
          changeChipVotes(btn, event.shiftKey ? -1 : 1);
          btn.focus();
          return;
        }
        if(event.shiftKey){
          event.preventDefault();
          if(chipClickTimer){ clearTimeout(chipClickTimer); chipClickTimer = null; }
          const currentStage = Number(btn.dataset.scaleStage || '0');
          if(currentStage !== 0){
            pushUndoSnapshot();
            updateBaseMetrics(btn);
            applyStageToChip(btn, 0);
            scheduleLayout();
            saveChips();
          }
          btn.focus();
          return;
        }
        if(chipClickTimer){
          clearTimeout(chipClickTimer);
          chipClickTimer = null;
          return;
        }
        chipClickTimer = setTimeout(() => {
          chipClickTimer = null;
          cycleChipStage(btn);
          btn.focus();
        }, 210);
      });
      btn.addEventListener('dblclick',(event)=>{
        event.preventDefault();
        if(chipClickTimer){ clearTimeout(chipClickTimer); chipClickTimer = null; }
        if(votingMode) return;
        startChipEdit(btn);
      });
      btn.addEventListener('keydown',(e)=>{
        if(e.key==='Enter'||e.key===' '){
          e.preventDefault();
          if(votingMode) changeChipVotes(btn, e.shiftKey ? -1 : 1);
          else cycleChipStage(btn);
        } else if(e.key==='Delete'){
          e.preventDefault();
          const host=btn.closest('.btn-wrap');
          if(host){
            pushUndoSnapshot();
            if(chipResizeObserver) chipResizeObserver.unobserve(btn);
            host.remove();
            scheduleLayout();
            saveChips();
          }
        }
      });
      wrap.appendChild(btn);
      syncVoteBadge(btn);
      syncChipGroup(btn);
      syncChipBadge(btn);
      return wrap;
    }

    function sortWrapsBy(compare){
      if(!list) return [];
      const wraps = Array.from(list.children).filter(node => node instanceof HTMLElement);
      wraps.sort(compare).forEach(node => list.appendChild(node));
      return wraps;
    }

    function restoreCreationOrder(){
      sortWrapsBy((a, b) => {
        const aChip = a.firstElementChild instanceof HTMLElement ? a.firstElementChild : null;
        const bChip = b.firstElementChild instanceof HTMLElement ? b.firstElementChild : null;
        const aPinned = Boolean(aChip && aChip.dataset.pinned === '1');
        const bPinned = Boolean(bChip && bChip.dataset.pinned === '1');
        if(aPinned !== bPinned) return aPinned ? -1 : 1;
        const aOrder = Number(a.dataset.createdAt || '0');
        const bOrder = Number(b.dataset.createdAt || '0');
        if(!Number.isFinite(aOrder) && !Number.isFinite(bOrder)) return 0;
        if(!Number.isFinite(aOrder)) return 1;
        if(!Number.isFinite(bOrder)) return -1;
        return aOrder - bOrder;
      });
    }

    function updateLayoutModeUI(){
      const mode = layoutConfig.mode;
      const isMasonry = mode === 'masonry';
      const isStack = mode === 'stack';
      if(masonryToggleBtn){
        masonryToggleBtn.classList.toggle('btn-primary', isMasonry);
        masonryToggleBtn.setAttribute('aria-pressed', String(isMasonry));
      }
      if(oneLineToggleBtn){
        oneLineToggleBtn.classList.toggle('btn-primary', isStack);
        oneLineToggleBtn.setAttribute('aria-pressed', String(isStack));
      }
    }

    function setLayoutMode(mode, { force = false, reorder = true } = {}){
      const next = mode === 'masonry' ? 'masonry' : mode === 'stack' ? 'stack' : 'flow';
      const changed = layoutConfig.mode !== next;
      if(next !== 'stack' && dragState.wrap){
        finalizeDrag();
      }
      layoutConfig.mode = next;
      if(reorder && (next === 'flow' || next === 'stack')){
        restoreCreationOrder();
      }
      updateLayoutModeUI();
      syncStackDragState();
      if(changed || force){
        scheduleLayout();
      }
    }

    function spotlightRandomChip(){
      if(!list) return;
      const chips = Array.from(list.querySelectorAll('.btn-item'));
      if(!chips.length) return;
      let pool = chips;
      if(chips.length > 1 && lastRandomChip){
        const filtered = chips.filter(chip => chip !== lastRandomChip);
        if(filtered.length) pool = filtered;
      }
      const target = pool[Math.floor(Math.random() * pool.length)];
      clearAllSpotlights();
      toggleChipSpotlight(target);
      target.focus({ preventScroll: true });
      try{ target.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' }); }catch(_){}
      lastRandomChip = target;
    }

    function getChipData(){
      if(!list) return [];
      const payload = [];
      list.querySelectorAll('.btn-item').forEach(btn=>{
        const raw = (btn.dataset.label || '').trim();
        if(!raw) return;
        const host = btn.closest('.btn-wrap');
        const orderValue = host ? Number(host.dataset.createdAt || '') : NaN;
        payload.push({
          label: raw,
          color: btn.dataset.color || null,
          scaleStage: Number(btn.dataset.scaleStage || '0'),
          display: btn.textContent || '',
          order: Number.isFinite(orderValue) ? orderValue : null,
          pinned: btn.dataset.pinned === '1',
          group: btn.dataset.group || null,
          votes: Math.max(0, Math.round(Number(btn.dataset.votes || '0')) || 0)
        });
      });
      return payload;
    }

    function saveChips(){
      if(!list) return;
      const activeSave = getActiveSave();
      if(!activeSave) return;
      activeSave.chips = getChipData();
      persistSaveState();
    }

    function appendChipFromData(item){
      if(!list || !item || typeof item.label!=='string') return;
      const text = item.label.trim();
      if(!text) return;
      const display = typeof item.display==='string' ? item.display : undefined;
      const orderNumeric = Number(item.order);
      const node=createChip(text, {
        color: item.color || undefined,
        skipRandom: true,
        displayText: display,
        createdAt: Number.isFinite(orderNumeric) ? orderNumeric : undefined,
        pinned: Boolean(item.pinned),
        group: item.group || undefined,
        votes: Math.max(0, Math.round(Number(item.votes || 0)) || 0)
      });
      list.appendChild(node);
      const btn=node.querySelector('.btn-item');
      if(btn){
        const stage = Number(item.scaleStage || 0);
        applyStageToChip(btn, stage, { remeasure: true });
      }
    }

    function replaceChips(data, { persist = true, focus = true } = {}){
      if(!list) return;
      list.innerHTML = '';
      chipSequence = 0;
      if(Array.isArray(data)) data.forEach(appendChipFromData);
      restoreCreationOrder();
      setLayoutMode('flow', { force: true, reorder: false });
      refreshChipMetrics();
      if(persist) saveChips();
      if(focus && input) input.focus();
      scheduleLayout();
    }

    function loadChips(){
      renderSaveSelector();
      const activeSave = getActiveSave();
      replaceChips(activeSave ? activeSave.chips : [], { persist: false, focus: false });
    }

    function activateSave(id){
      if(typeof id !== 'string' || id === saveState.activeId) return;
      if(!saveState.saves.some(save => save.id === id)) return;
      saveChips();
      clearUndoHistory();
      saveState.activeId = id;
      persistSaveState();
      renderSaveSelector();
      const activeSave = getActiveSave();
      replaceChips(activeSave ? activeSave.chips : [], { persist: false });
    }

    function createNewSave(){
      saveChips();
      clearUndoHistory();
      const newSave = {
        id: makeSaveId(),
        name: nextSaveName(saveState.saves),
        chips: []
      };
      saveState.saves.push(newSave);
      saveState.activeId = newSave.id;
      persistSaveState();
      renderSaveSelector();
      replaceChips([], { persist: false });
    }

    function addFromInput(){
      const value=input.value.trim();
      if(!value) return;
      pushUndoSnapshot();
      const node=createChip(value);
      list.appendChild(node);
      scheduleLayout();
      saveChips();
      input.value='';
      input.focus();
    }
    function clearAllChips(){
      if(!list) return;
      if(list.children.length) pushUndoSnapshot();
      list.innerHTML='';
      chipSequence = 0;
      scheduleLayout();
      saveChips();
      if(input) input.focus();
    }
    loadChips();
    scheduleLayout();
    settingsReady = true;
    persistSettings();
    updateLayoutModeUI();
    updateUndoButton();
    applyBeamerTheme(readStorage(BEAMER_THEME_KEY) === 'dark' ? 'dark' : 'light', false);
    timerState = loadTimerState();
    persistTimerState();
    syncTimerUI();
    timerTickHandle = window.setInterval(syncTimerUI, 250);
    window.addEventListener('focus', syncTimerUI);
    document.addEventListener('visibilitychange', () => { if(!document.hidden) syncTimerUI(); });
    window.addEventListener('storage', event => {
      if(event.key !== TIMER_STORAGE_KEY || !event.newValue) return;
      try{
        timerState = normalizeTimerState(JSON.parse(event.newValue));
        syncTimerUI();
      }catch(_){}
    });

    if(settingsBtn && settingsPanel){
      const setSettingsOpen = (open) => {
        settingsPanel.hidden = !open;
        settingsBtn.setAttribute('aria-expanded', String(open));
      };
      settingsBtn.addEventListener('click', (event) => {
        event.stopPropagation();
        if(timerPanel){
          timerPanel.hidden = true;
          if(timerBtn) timerBtn.setAttribute('aria-expanded','false');
        }
        setSettingsOpen(settingsPanel.hidden);
      });
      settingsPanel.addEventListener('click', event => event.stopPropagation());
      document.addEventListener('click', () => setSettingsOpen(false));
      document.addEventListener('keydown', event => {
        if(event.key === 'Escape') setSettingsOpen(false);
      });
    }

    if(saveSelect){
      saveSelect.addEventListener('change', ()=>activateSave(saveSelect.value));
    }

    if(newSaveBtn){
      newSaveBtn.addEventListener('click', createNewSave);
    }

    if(undoBtn) undoBtn.addEventListener('click', undoLastAction);
    if(randomBtn) randomBtn.addEventListener('click', spotlightRandomChip);
    if(themeBtn){
      themeBtn.addEventListener('click', () => {
        const dark = document.documentElement.dataset.beamerTheme === 'dark';
        applyBeamerTheme(dark ? 'light' : 'dark');
      });
    }
    if(presentBtn){
      presentBtn.addEventListener('click', () => {
        const active = document.documentElement.classList.contains('presentation-mode');
        setPresentationMode(!active);
      });
    }


    if(voteBtn){
      voteBtn.addEventListener('click', () => setVotingMode(!votingMode));
      voteBtn.addEventListener('contextmenu', event => {
        event.preventDefault();
        resetAllVotes();
      });
    }

    if(timerBtn && timerPanel){
      const setTimerPanelOpen = open => {
        timerPanel.hidden = !open;
        timerBtn.setAttribute('aria-expanded', String(open));
        if(open && settingsPanel){
          settingsPanel.hidden = true;
          if(settingsBtn) settingsBtn.setAttribute('aria-expanded','false');
        }
      };
      timerBtn.addEventListener('click', event => {
        event.stopPropagation();
        setTimerPanelOpen(timerPanel.hidden);
      });
      timerPanel.addEventListener('click', event => event.stopPropagation());
      document.addEventListener('click', () => setTimerPanelOpen(false));
      document.addEventListener('keydown', event => {
        if(event.key === 'Escape' && !timerState?.xl) setTimerPanelOpen(false);
      });
    }

    if(timerMinutesInput){
      timerMinutesInput.addEventListener('change', () => setTimerMinutes(timerMinutesInput.value));
      timerMinutesInput.addEventListener('keydown', event => {
        if(event.key === 'Enter'){
          event.preventDefault();
          setTimerMinutes(timerMinutesInput.value);
          timerMinutesInput.blur();
        }
      });
    }
    document.querySelectorAll('.timer-preset').forEach(button => {
      button.addEventListener('click', () => setTimerMinutes(button.dataset.minutes));
    });
    if(timerStartPauseBtn) timerStartPauseBtn.addEventListener('click', toggleTimerRunning);
    if(timerResetBtn) timerResetBtn.addEventListener('click', resetTimer);
    if(timerXLBtn) timerXLBtn.addEventListener('click', () => setTimerXL(true));
    if(timerXLClose) timerXLClose.addEventListener('click', () => setTimerXL(false));
    if(timerXLToggle) timerXLToggle.addEventListener('click', toggleTimerRunning);
    if(timerXLReset) timerXLReset.addEventListener('click', resetTimer);

    if(masonryToggleBtn){
      masonryToggleBtn.addEventListener('click', ()=>{
        const nextMode = layoutConfig.mode === 'masonry' ? 'flow' : 'masonry';
        setLayoutMode(nextMode, { force: true });
        if(nextMode === 'flow'){
          saveChips();
        }
      });
    }

    if(oneLineToggleBtn){
      oneLineToggleBtn.addEventListener('click', ()=>{
        const nextMode = layoutConfig.mode === 'stack' ? 'flow' : 'stack';
        setLayoutMode(nextMode, { force: true });
        if(nextMode === 'flow'){
          saveChips();
        }
      });
    }

    if(exportBtn){
      exportBtn.addEventListener('click', ()=>{
        const payload = getChipData();
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = EXPORT_FILENAME;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(()=>URL.revokeObjectURL(url), 0);
      });
    }

    if(importBtn && importFileInput){
      importBtn.addEventListener('click', ()=>{
        importFileInput.value = '';
        importFileInput.click();
      });
      importFileInput.addEventListener('change', ()=>{
        const file = importFileInput.files && importFileInput.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try{
            const text = reader.result;
            const parsed = JSON.parse(typeof text === 'string' ? text : '');
            if(!Array.isArray(parsed)) throw new Error('Invalid JSON');
            pushUndoSnapshot();
            replaceChips(parsed);
          }catch(err){
            console.warn('Import failed:', err);
            alert('Import failed. Please choose a valid export JSON file.');
          }finally{
            importFileInput.value = '';
          }
        };
        reader.onerror = () => {
          console.warn('Import file read error:', reader.error);
          alert('Could not read the selected file.');
          importFileInput.value = '';
        };
        reader.readAsText(file);
      });
    }

    addBtn.addEventListener('click', addFromInput);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); addFromInput(); } });

    // Delete key removes focused chip
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && typeof e.key==='string' && e.key.toLowerCase()==='d'){
        if(isTypingContext(e.target)) return;
        e.preventDefault();
        if(window.confirm('Delete all items?')){
          clearAllChips();
        }
        return;
      }
    });
    document.addEventListener('keydown', (e)=>{
      if(e.key!=='Delete' || isTypingContext(e.target)) return;
      const active = document.activeElement;
      if(active && active.classList && active.classList.contains('btn-item')){
        e.preventDefault();
        const btn = active;
        const host = btn.closest('.btn-wrap');
        if(host){
          pushUndoSnapshot();
          if(chipResizeObserver) chipResizeObserver.unobserve(btn);
          host.remove();
          scheduleLayout();
          saveChips();
        }
        input.focus();
      }
    });

    // Toggle emojis on existing chips
    const reEmojiBtn=document.getElementById('reEmoji');
    if(reEmojiBtn){
      reEmojiBtn.addEventListener('click', ()=>{
        const buttons=Array.from(list.querySelectorAll('.btn-item'));
        const removeEmojis=buttons.some(btn=>startsWithEmoji(btn.textContent||''));
        if(buttons.length) pushUndoSnapshot();
        let changed=0;
        buttons.forEach(btn=>{
          const txt=btn.textContent||'';
          if(removeEmojis){
            const clean=removeLeadingEmoji(txt);
            if(clean!==txt){ btn.textContent=clean; changed++; }
          }else if(!startsWithEmoji(txt)){
            const em=detectEmoji(txt);
            if(em){ btn.textContent=em+' '+txt; changed++; }
          }
        });
        try{ reEmojiBtn.animate([{transform:'scale(1)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:220}); }catch(err){}
        reEmojiBtn.title = removeEmojis
          ? (changed ? ('Removed emojis from '+changed+' chip'+(changed===1?'':'s')) : 'No emojis to remove')
          : (changed ? ('Added emojis to '+changed+' chip'+(changed===1?'':'s')) : 'No changes (nothing matched)');
        refreshChipMetrics();
        saveChips();
      });
    }

    // ===== Smoke tests (manual) =====
    function runSmokeTests(){ try{ const before=list.children.length; if(emojiToggle) emojiToggle.checked=true; ['Bug','Kaffeemaschine','Lift','YouTube','TikTok','Webseite','Computer','Netzwerk','Drucker'].forEach(t=>{ input.value=t; addFromInput(); }); const after=list.children.length; console.assert(after>=before+9, 'Should add 9 chips'); const first=list.querySelector('.btn-item'); console.assert(first && /\p{Extended_Pictographic}/u.test(first.textContent.trim().charAt(0))===true, 'First chip should start with an emoji'); first.click(); console.assert(Number(first.dataset.scaleStage||'0')===1,'First cycle should set stage 1'); first.click(); console.assert(Number(first.dataset.scaleStage||'0')===2,'Second cycle should set stage 2'); first.click(); console.assert(Number(first.dataset.scaleStage||'0')===3,'Third cycle should set stage 3'); first.click(); console.assert(Number(first.dataset.scaleStage||'0')===0,'Fourth cycle should reset stage'); const emojiBtn=document.getElementById('reEmoji'); emojiBtn.click(); console.assert(!startsWithEmoji(first.textContent),'Emoji button should remove leading emojis'); emojiBtn.click(); console.assert(startsWithEmoji(first.textContent),'Emoji button should add leading emojis'); }catch(e){ console.warn('Smoke tests issue (non-fatal):', e); } }
    try{ if(new URLSearchParams(location.search).get('tests')==='1') runSmokeTests(); }catch(_){ }
  </script>

  <script>
    (() => {
      const CHIP_SHAPE_KEY = 'discussion.chipShape.v1';
      const root = document.documentElement;
      const group = document.querySelector('.options-row .control-group');
      if(!group) return;

      const control = document.createElement('div');
      control.className = 'shape-control';
      control.setAttribute('role', 'group');
      control.setAttribute('aria-label', 'Form der Chips');
      control.innerHTML = '<span class="shape-label">Form</span>' +
        '<button id="shapePill" class="shape-btn" type="button">Pill</button>' +
        '<button id="shapeRounded" class="shape-btn" type="button" title="Rechteck abgerundet">Rechteck</button>';

      const masonry = document.getElementById('masonryToggle');
      group.insertBefore(control, masonry || null);

      const pillBtn = document.getElementById('shapePill');
      const roundedBtn = document.getElementById('shapeRounded');

      const readShape = () => {
        try{
          return localStorage.getItem(CHIP_SHAPE_KEY) === 'rounded' ? 'rounded' : 'pill';
        }catch(_){
          return 'pill';
        }
      };

      const applyShape = (shape, persist = true) => {
        const next = shape === 'rounded' ? 'rounded' : 'pill';
        root.dataset.chipShape = next;
        pillBtn.classList.toggle('is-active', next === 'pill');
        roundedBtn.classList.toggle('is-active', next === 'rounded');
        pillBtn.setAttribute('aria-pressed', String(next === 'pill'));
        roundedBtn.setAttribute('aria-pressed', String(next === 'rounded'));
        if(persist){
          try{ localStorage.setItem(CHIP_SHAPE_KEY, next); }catch(_){}
        }
        if(typeof scheduleLayout === 'function') scheduleLayout();
      };

      pillBtn.addEventListener('click', () => applyShape('pill'));
      roundedBtn.addEventListener('click', () => applyShape('rounded'));
      applyShape(readShape(), false);
    })();
  </script>
