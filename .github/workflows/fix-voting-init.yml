name: Fix voting initialization

on:
  push:
    branches: [main]
    paths:
      - '.github/fix_voting_init.py'
      - '.github/workflows/fix-voting-init.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused fix
        run: python .github/fix_voting_init.py
      - name: Syntax check main script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if not scripts:
              raise SystemExit('No script blocks found')
          Path('/tmp/discussion-main.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/discussion-main.js
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix voting initialization [skip ci]"
          git push
