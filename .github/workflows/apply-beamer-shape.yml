name: Apply beamer width and chip shape

on:
  push:
    paths:
      - .github/workflows/apply-beamer-shape.yml

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: python .github/apply_beamer_shape.py
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add chip shape selector and beamer full-width layout [skip ci]"
          git push origin HEAD:main
