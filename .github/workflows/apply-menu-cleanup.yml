name: Apply menu cleanup

on:
  push:
    paths:
      - .github/workflows/apply-menu-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply focused menu patch
        run: python .github/apply_menu_cleanup.py

      - name: Syntax check scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/discussion-main.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/discussion-main.js

      - name: Assert cleaned menu structure
        run: |
          grep -q 'id="shapeRounded"' index.html
          grep -q 'id="themeDarkBtn"' index.html
          grep -q 'menu-section-title">Darstellung' index.html
          grep -q 'return localStorage.getItem(CHIP_SHAPE_KEY) === '\''pill'\'' ? '\''pill'\'' : '\''rounded'\''' index.html
          ! grep -q 'id="themeBtn"' index.html

      - name: Commit result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restructure menus and default to rounded chips [skip ci]"
          git push origin HEAD:main
